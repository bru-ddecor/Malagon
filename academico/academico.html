<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acadêmico | Malagon</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="academico.css">
</head>

<body>
    <div class="page-wrapper">
        <div class="header-secao">
            <h1>Universidades para o seu intercâmbio</h1>
            <p class="intro">Encontre as melhores universidades de acordo com o país do seu intercâmbio e o seu perfil acadêmico.</p>
        </div>

        <!-- Conteúdo Principal Flex (Filtros + Resultados) -->
        <div class="conteudo-principal">
            
            <!-- Painel de Filtros -->
            <aside class="filtro">
                <div class="filtro-titulo">
                    <h3>Filtros</h3>
                </div>

                <!-- Campo de Pesquisa por Nome -->
                <div class="campo-filtro">
                    <label for="inputBusca">Nome da Universidade</label>
                    <input type="text" id="inputBusca" placeholder="Ex: Harvard, Munich...">
                </div>

                <div class="campo-filtro">
                    <label for="pais">País de Destino</label>
                    <select id="pais">
                        <option value="">Carregando países...</option>
                    </select>
                </div>

                <div class="campo-filtro">
                    <label for="area">Área de interesse</label>
                    <select id="area">
                        <option value="">Selecione uma área</option>
                        <option value="ti">Tecnologia da Informação</option>
                        <option value="engenharia">Engenharia</option>
                        <option value="dados">Ciência de Dados</option>
                    </select>
                </div>

                <div class="campo-filtro">
                    <label for="nivel">Nível de estudo</label>
                    <select id="nivel">
                        <option value="">Selecione o nível</option>
                        <option value="graduacao">Graduação</option>
                        <option value="pos">Pós-graduação</option>
                    </select>
                </div>

                <div class="campo-filtro">
                    <label for="idioma">Idioma do curso</label>
                    <select id="idioma">
                        <option value="">Selecione o Idioma</option>
                        <option value="ingles">Inglês</option>
                        <option value="espanhol">Espanhol</option>
                        <option value="portugues">Português</option>
                    </select>
                </div>

                <button class="btn-aplicar" id="btnAplicar">Aplicar Filtros</button>
                <button class="btn-limpar" id="btnLimpar">Limpar filtros</button>
            </aside>

            <!-- Lista de Resultados -->
            <main class="resultados">
                <div class="resultados-header">
                    <span id="totalUniversidades">0 universidades encontradas</span>
                </div>

                <!-- Container onde os cards serão gerados via JavaScript -->
                <div id="listaUniversidades" class="lista-cards"></div>
            </main>

        </div>
    </div>

    <script src="../shared/navbar.js"></script>
    <script src="academico.js"></script>
</body>

</html>
